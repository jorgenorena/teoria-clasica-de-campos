name: Deploy course notes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Export LaTeX notes
        run: uv run --frozen python export_tex.py fragments

      - name: Build the static site
        run: uv run --frozen python build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
